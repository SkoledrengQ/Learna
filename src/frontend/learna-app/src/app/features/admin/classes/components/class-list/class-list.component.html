<app-page-header [title]="'admin.classes.title' | transloco">
  <mat-form-field pageActions appearance="outline" class="year-filter" subscriptSizing="dynamic">
    <mat-label>{{ 'admin.classes.schoolYearFilterLabel' | transloco }}</mat-label>
    <mat-select
      [value]="selectedSchoolYearId()"
      (selectionChange)="onSchoolYearFilterChange($event.value)">
      <mat-option [value]="null">{{ 'admin.classes.allSchoolYears' | transloco }}</mat-option>
      <mat-option *ngFor="let year of schoolYears()" [value]="year.id">{{ year.name }}</mat-option>
    </mat-select>
  </mat-form-field>

  <button pageActions mat-flat-button color="primary" (click)="onAddClass()">
    <mat-icon>add</mat-icon>
    {{ 'admin.classes.addNew' | transloco }}
  </button>
</app-page-header>

<app-loading-state *ngIf="isLoading()" [message]="'admin.classes.loadingClasses' | transloco" />

<mat-card *ngIf="!isLoading()">
  <mat-card-content>
    <app-empty-state
      *ngIf="classes().length === 0; else table"
      icon="meeting_room"
      [message]="'admin.classes.noClassesFound' | transloco"
      [actionLabel]="'admin.classes.addNew' | transloco"
      (action)="onAddClass()"
    />

    <ng-template #table>
    <div class="table-container">
      <table mat-table [dataSource]="classes()" class="mat-elevation-z2 app-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>{{ 'admin.classes.name' | transloco }}</th>
          <td mat-cell *matCellDef="let schoolClass">{{ schoolClass.name }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>{{ 'admin.classes.description' | transloco }}</th>
          <td mat-cell *matCellDef="let schoolClass">{{ schoolClass.description }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>{{ 'common.actions' | transloco }}</th>
          <td mat-cell *matCellDef="let schoolClass" class="actions-cell">
            <button mat-icon-button color="primary" (click)="onEditClass(schoolClass.id)" [matTooltip]="'common.edit' | transloco">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="onDeleteClass(schoolClass)" [matTooltip]="'common.delete' | transloco">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
    </ng-template>
  </mat-card-content>
</mat-card>
