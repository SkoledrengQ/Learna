<h2 mat-dialog-title>{{ 'admin.classes.addMemberDialogTitle' | transloco }}</h2>

<mat-dialog-content>
  <div class="form-row">
    <mat-form-field appearance="outline">
      <mat-label>{{ 'admin.classes.studentLabel' | transloco }}</mat-label>
      <input
        matInput
        [value]="filterText()"
        (input)="onFilterInput($any($event.target).value)"
        [matAutocomplete]="auto"
        [placeholder]="'admin.classes.studentSearchPlaceholder' | transloco">
      <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onStudentSelected($event.option.value)">
        <mat-option *ngFor="let student of filteredStudents()" [value]="student">
          {{ getDisplayName(student.name) }} ({{ student.studentId }})
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>
  </div>

  <div class="form-row">
    <mat-form-field appearance="outline">
      <mat-label>{{ 'admin.classes.joinedDateLabel' | transloco }}</mat-label>
      <input matInput [matDatepicker]="joinedPicker" [(ngModel)]="joinedDate">
      <mat-datepicker-toggle matIconSuffix [for]="joinedPicker"></mat-datepicker-toggle>
      <mat-datepicker #joinedPicker></mat-datepicker>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">{{ 'common.cancel' | transloco }}</button>
  <button mat-flat-button color="primary" [disabled]="!selectedStudent()" (click)="onAdd()">{{ 'common.add' | transloco }}</button>
</mat-dialog-actions>
