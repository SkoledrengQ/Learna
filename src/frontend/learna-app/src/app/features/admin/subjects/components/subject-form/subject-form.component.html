<mat-card>
  <mat-card-header>
    <mat-card-title>{{ isEditMode ? 'Edit Subject' : 'Add New Subject' }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="subjectForm" (ngSubmit)="onSubmit()" *ngIf="!isLoading()">
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Code</mat-label>
          <input matInput formControlName="code" placeholder="Internal id, e.g. math">
          <mat-error *ngIf="subjectForm.get('code')?.invalid">
            {{ getErrorMessage('code') }}
          </mat-error>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>English Name</mat-label>
          <input matInput formControlName="nameEnglish" placeholder="e.g. Mathematics">
          <mat-error *ngIf="subjectForm.get('nameEnglish')?.invalid">
            {{ getErrorMessage('nameEnglish') }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Thai Name</mat-label>
          <input matInput formControlName="nameThai" placeholder="e.g. คณิตศาสตร์">
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" placeholder="Optional" rows="2"></textarea>
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button mat-button type="button" (click)="onCancel()">Cancel</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="isLoading()">
          {{ isEditMode ? 'Update' : 'Create' }} Subject
        </button>
      </div>
    </form>

    <div class="loading-container" *ngIf="isLoading()">
      <p>{{ isEditMode ? 'Loading subject data...' : 'Saving...' }}</p>
    </div>
  </mat-card-content>
</mat-card>
