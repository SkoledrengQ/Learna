<app-page-header [title]="(isEditMode ? 'admin.rooms.editTitle' : 'admin.rooms.addTitle') | transloco" />

<mat-card>
  <mat-card-content>
    <form [formGroup]="roomForm" (ngSubmit)="onSubmit()" *ngIf="!isLoading()">
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'admin.rooms.name' | transloco }}</mat-label>
          <input matInput formControlName="name" [placeholder]="'admin.rooms.placeholderName' | transloco">
          <mat-error *ngIf="roomForm.get('name')?.invalid">
            {{ getErrorMessage('name') }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>{{ 'admin.rooms.building' | transloco }}</mat-label>
          <input matInput formControlName="building" [placeholder]="'common.optional' | transloco">
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'admin.rooms.capacity' | transloco }}</mat-label>
          <input matInput type="number" formControlName="capacity" [placeholder]="'common.optional' | transloco">
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'admin.rooms.description' | transloco }}</mat-label>
          <textarea matInput formControlName="description" [placeholder]="'common.optional' | transloco" rows="3"></textarea>
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button mat-button type="button" (click)="onCancel()">{{ 'common.cancel' | transloco }}</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="isLoading()">
          {{ (isEditMode ? 'admin.rooms.updateRoom' : 'admin.rooms.createRoom') | transloco }}
        </button>
      </div>
    </form>

    <div class="loading-container" *ngIf="isLoading()">
      <p>{{ (isEditMode ? 'admin.rooms.loadingRoomData' : 'common.saving') | transloco }}</p>
    </div>
  </mat-card-content>
</mat-card>
