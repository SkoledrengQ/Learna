<mat-card>
  <mat-card-header>
    <mat-card-title>School Years</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="table-header">
      <button mat-raised-button color="primary" (click)="onAddSchoolYear()">
        <mat-icon>add</mat-icon>
        Add New School Year
      </button>
    </div>

    <div class="table-container" *ngIf="!isLoading()">
      <table mat-table [dataSource]="schoolYears()" class="mat-elevation-z2">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let schoolYear">{{ schoolYear.name }}</td>
        </ng-container>

        <ng-container matColumnDef="startDate">
          <th mat-header-cell *matHeaderCellDef>Start Date</th>
          <td mat-cell *matCellDef="let schoolYear">{{ formatDate(schoolYear.startDate) }}</td>
        </ng-container>

        <ng-container matColumnDef="endDate">
          <th mat-header-cell *matHeaderCellDef>End Date</th>
          <td mat-cell *matCellDef="let schoolYear">{{ formatDate(schoolYear.endDate) }}</td>
        </ng-container>

        <ng-container matColumnDef="isArchived">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let schoolYear">
            <span class="archived-badge" *ngIf="schoolYear.isArchived">Archived</span>
            <span *ngIf="!schoolYear.isArchived">Active</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let schoolYear">
            <button mat-icon-button color="primary" (click)="onEditSchoolYear(schoolYear.id)" matTooltip="Edit">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="onDeleteSchoolYear(schoolYear)" matTooltip="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            No school years found. Click "Add New School Year" to create one.
          </td>
        </tr>
      </table>
    </div>

    <div class="loading-container" *ngIf="isLoading()">
      <p>Loading school years...</p>
    </div>
  </mat-card-content>
</mat-card>
