<mat-card>
  <mat-card-header>
    <mat-card-title>Teachers</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="table-header">
      <button mat-raised-button color="primary" (click)="onAddTeacher()">
        <mat-icon>add</mat-icon>
        Add New Teacher
      </button>
    </div>

    <div class="table-container" *ngIf="!isLoading()">
      <table mat-table [dataSource]="teachers()" class="mat-elevation-z2">
        <ng-container matColumnDef="employeeId">
          <th mat-header-cell *matHeaderCellDef>Employee ID</th>
          <td mat-cell *matCellDef="let teacher">{{ teacher.employeeId }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let teacher">{{ getDisplayName(teacher) }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let teacher">{{ teacher.email }}</td>
        </ng-container>

        <ng-container matColumnDef="phoneNumber">
          <th mat-header-cell *matHeaderCellDef>Phone</th>
          <td mat-cell *matCellDef="let teacher">{{ teacher.phoneNumber }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let teacher">
            <button mat-icon-button color="primary" (click)="onEditTeacher(teacher.id)" matTooltip="Edit">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="onDeleteTeacher(teacher)" matTooltip="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            No teachers found. Click "Add New Teacher" to create one.
          </td>
        </tr>
      </table>
    </div>

    <div class="loading-container" *ngIf="isLoading()">
      <p>Loading teachers...</p>
    </div>
  </mat-card-content>
</mat-card>
