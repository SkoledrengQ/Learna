<h2 mat-dialog-title>Enroll Entire Class</h2>

<mat-dialog-content>
  <div class="form-row">
    <mat-form-field appearance="outline">
      <mat-label>School Year</mat-label>
      <mat-select [(ngModel)]="selectedSchoolYearId" (selectionChange)="onSchoolYearChange($event.value)">
        <mat-option *ngFor="let year of schoolYears()" [value]="year.id">{{ year.name }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="form-row">
    <mat-form-field appearance="outline">
      <mat-label>Class</mat-label>
      <mat-select [(ngModel)]="selectedClassId">
        <mat-option *ngFor="let schoolClass of classes()" [value]="schoolClass.id">{{ schoolClass.name }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <p class="hint">All active members of the selected class will be enrolled. Students already enrolled are skipped.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="!selectedClassId" (click)="onEnroll()">Enroll Class</button>
</mat-dialog-actions>
