<h2 mat-dialog-title>Enroll Students</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search by name or student ID</mat-label>
    <input matInput [value]="filterText()" (input)="onFilterInput($any($event.target).value)">
  </mat-form-field>

  <p class="hint">Students may be from any class.</p>

  <div class="student-list">
    <div class="student-row" *ngFor="let student of filteredStudents()">
      <mat-checkbox [checked]="isSelected(student.id)" (change)="toggleStudent(student.id)">
        {{ getDisplayName(student.name) }} ({{ student.studentId }})
      </mat-checkbox>
    </div>

    <p class="hint" *ngIf="filteredStudents().length === 0">No matching students.</p>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="selectedStudentIds().size === 0" (click)="onEnroll()">
    Enroll {{ selectedStudentIds().size || '' }} Student{{ selectedStudentIds().size === 1 ? '' : 's' }}
  </button>
</mat-dialog-actions>
