<h2 mat-dialog-title>{{ 'admin.subjectGroups.enrollStudentsDialogTitle' | transloco }}</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>{{ 'admin.subjectGroups.searchLabel' | transloco }}</mat-label>
    <input matInput [value]="filterText()" (input)="onFilterInput($any($event.target).value)">
  </mat-form-field>

  <p class="hint">{{ 'admin.subjectGroups.anyClassHint' | transloco }}</p>

  <div class="student-list">
    <div class="student-row" *ngFor="let student of filteredStudents()">
      <mat-checkbox [checked]="isSelected(student.id)" (change)="toggleStudent(student.id)">
        {{ getDisplayName(student.name) }} ({{ student.studentId }})
      </mat-checkbox>
    </div>

    <p class="hint" *ngIf="filteredStudents().length === 0">{{ 'admin.subjectGroups.noMatchingStudents' | transloco }}</p>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">{{ 'common.cancel' | transloco }}</button>
  <button mat-raised-button color="primary" [disabled]="selectedStudentIds().size === 0" (click)="onEnroll()">
    {{ 'admin.subjectGroups.enrollButton' | transloco: { count: (selectedStudentIds().size || ''), plural: selectedStudentIds().size === 1 ? '' : 's' } }}
  </button>
</mat-dialog-actions>
