<mat-card>
  <mat-card-header>
    <mat-card-title>Subject Groups</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="table-header">
      <div class="filters">
        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>School Year</mat-label>
          <mat-select
            [value]="selectedSchoolYearId()"
            (selectionChange)="onSchoolYearChange($event.value)">
            <mat-option *ngFor="let year of schoolYears()" [value]="year.id">{{ year.name }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>Term</mat-label>
          <mat-select
            [value]="selectedTermId()"
            (selectionChange)="onTermChange($event.value)">
            <mat-option *ngFor="let term of terms()" [value]="term.id">{{ term.name }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <button mat-raised-button color="primary" (click)="onAddGroup()">
        <mat-icon>add</mat-icon>
        Add New Subject Group
      </button>
    </div>

    <div class="table-container" *ngIf="!isLoading()">
      <table mat-table [dataSource]="groups()" class="mat-elevation-z2">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let group">{{ group.name }}</td>
        </ng-container>

        <ng-container matColumnDef="subject">
          <th mat-header-cell *matHeaderCellDef>Subject</th>
          <td mat-cell *matCellDef="let group">{{ subjectName(group.subjectId) }}</td>
        </ng-container>

        <ng-container matColumnDef="teacher">
          <th mat-header-cell *matHeaderCellDef>Teacher</th>
          <td mat-cell *matCellDef="let group">{{ group.teacherId ? 'Assigned' : 'Unassigned' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let group">
            <button mat-icon-button color="primary" (click)="onEditGroup(group.id)" matTooltip="Edit / manage roster">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="onDeleteGroup(group)" matTooltip="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            No subject groups found for this term.
          </td>
        </tr>
      </table>
    </div>

    <div class="loading-container" *ngIf="isLoading()">
      <p>Loading subject groups...</p>
    </div>
  </mat-card-content>
</mat-card>
