<main class="page">
  <app-page-header [title]="'materials.pageTitle' | transloco" />
  <app-child-selector *ngIf="portal.isGuardianLinked() && portal.selectedChild()"></app-child-selector>
  <app-loading-state *ngIf="loading()" [message]="'common.loading' | transloco" />
  <app-empty-state *ngIf="!loading() && visible().length===0" icon="folder" [message]="'materials.empty' | transloco" />
  <mat-card *ngFor="let group of groups()"><mat-card-header><mat-card-title>{{ group.name }}</mat-card-title></mat-card-header><mat-card-content><div class="file" *ngFor="let file of group.files"><div><strong>{{file.originalFileName}}</strong><p *ngIf="file.description">{{file.description}}</p><small>{{size(file.sizeBytes)}} · {{file.createdAt | localizedDate:language.activeLang():'mediumDate'}}<ng-container *ngIf="file.lessonDate"> · {{'materials.lessonTag'|transloco:{date:(file.lessonDate | localizedDate:language.activeLang())} }}</ng-container></small></div><button mat-icon-button (click)="download(file)"><mat-icon>download</mat-icon></button></div></mat-card-content></mat-card>
</main>
