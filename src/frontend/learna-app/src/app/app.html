<mat-toolbar color="primary">
  <span>{{ title() }}</span>
  <span class="spacer"></span>

  <ng-container *ngIf="isAuthenticated()">
    <button mat-button routerLink="/students" *ngIf="canViewStudents()">
      <mat-icon>school</mat-icon>
      {{ 'nav.students' | transloco }}
    </button>

    <button mat-button routerLink="/schedule">
      <mat-icon>calendar_month</mat-icon>
      {{ 'nav.schedule' | transloco }}
    </button>

    <button mat-button routerLink="/attendance" *ngIf="isStudentLinked()">
      <mat-icon>fact_check</mat-icon>{{ 'nav.attendance' | transloco }}
    </button>

    <ng-container *ngIf="isAdmin()">
      <button mat-button [matMenuTriggerFor]="adminMenu">
        <mat-icon>admin_panel_settings</mat-icon>
        {{ 'nav.admin' | transloco }}
      </button>
      <mat-menu #adminMenu="matMenu">
        <button mat-menu-item routerLink="/admin/users">
          <mat-icon>manage_accounts</mat-icon>
          {{ 'nav.users' | transloco }}
        </button>
        <button mat-menu-item routerLink="/admin/teachers">
          <mat-icon>person</mat-icon>
          {{ 'nav.teachers' | transloco }}
        </button>
        <button mat-menu-item routerLink="/admin/subjects">
          <mat-icon>book</mat-icon>
          {{ 'nav.subjects' | transloco }}
        </button>
        <button mat-menu-item routerLink="/admin/school-years">
          <mat-icon>calendar_today</mat-icon>
          {{ 'nav.schoolYears' | transloco }}
        </button>
        <button mat-menu-item routerLink="/admin/classes">
          <mat-icon>meeting_room</mat-icon>
          {{ 'nav.classes' | transloco }}
        </button>
        <button mat-menu-item routerLink="/admin/subject-groups">
          <mat-icon>groups</mat-icon>
          {{ 'nav.subjectGroups' | transloco }}
        </button>
        <button mat-menu-item routerLink="/admin/rooms">
          <mat-icon>door_front</mat-icon>
          {{ 'nav.rooms' | transloco }}
        </button>
        <button mat-menu-item routerLink="/admin/lessons">
          <mat-icon>event</mat-icon>
          {{ 'nav.lessons' | transloco }}
        </button>
        <button mat-menu-item routerLink="/admin/schedule">
          <mat-icon>calendar_month</mat-icon>
          {{ 'nav.adminSchedule' | transloco }}
        </button>
      </mat-menu>
    </ng-container>

    <button mat-button [matMenuTriggerFor]="userMenu"><mat-icon>account_circle</mat-icon>{{ currentUser()?.email }}</button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item (click)="onChangePassword()"><mat-icon>password</mat-icon>{{ 'auth.changePassword' | transloco }}</button>
      <button mat-menu-item (click)="onLogout()"><mat-icon>logout</mat-icon>{{ 'nav.logout' | transloco }}</button>
    </mat-menu>
  </ng-container>

  <button mat-button [matMenuTriggerFor]="languageMenu" [attr.aria-label]="'common.language' | transloco">
    <mat-icon>language</mat-icon>
    {{ languageService.activeLang() === 'th' ? 'ไทย' : 'EN' }}
  </button>
  <mat-menu #languageMenu="matMenu">
    <button mat-menu-item (click)="onSelectLanguage('en')">English</button>
    <button mat-menu-item (click)="onSelectLanguage('th')">ไทย</button>
  </mat-menu>
</mat-toolbar>

<router-outlet />
