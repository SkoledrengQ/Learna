services:
  mysql:
    image: mysql:8.0
    container_name: learna-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: learna_dev
    ports:
      - "3306:3306"
    volumes:
      - learna-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  learna-mysql-data:
